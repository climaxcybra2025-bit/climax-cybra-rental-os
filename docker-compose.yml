services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_os
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rental}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental_os"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://rental:${POSTGRES_PASSWORD:-rental}@db:5432/rental_os
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
